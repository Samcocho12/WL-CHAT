<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUX Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de login / registro -->
  <div id="login" class="login">
    <div class="caja-login">
      <h1>LUX Chat</h1>
      <p class="subtitulo">Chat en tiempo real con WebSockets</p>

      <input type="text" id="usuario" placeholder="Usuario" maxlength="20">
      <input type="password" id="clave" placeholder="Contraseña">

      <button id="btnEntrar">Iniciar sesión</button>
      <button id="btnRegistrar" class="secundario">Registrarse</button>

      <p id="error" class="error"></p>
      <p id="estado" class="estado">Conectando al servidor...</p>
    </div>
  </div>

  <!-- Pantalla del chat -->
  <div id="chat" class="chat oculto">
    <div class="encabezado">
      <h2>LUX Chat</h2>
      <div>
        <span id="nombreUsuario"></span>
        <button id="btnSalir">Salir</button>
      </div>
    </div>

    <div class="contenido">
      <div class="usuarios">
        <h3>Conectados (<span id="cantidad">0</span>)</h3>
        <ul id="listaUsuarios"></ul>
      </div>

      <div class="zona-mensajes">
        <div id="mensajes" class="mensajes"></div>
        <p id="escribiendo" class="escribiendo"></p>
        <div class="enviar">
          <input type="text" id="texto" placeholder="Escribe un mensaje..." maxlength="1000">
          <button id="btnEnviar">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
